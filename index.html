<!--
  index.html

  The only page of NextWatch. It defines the structure;
  style.css gives it its look and app.js makes it interactive.

  Layout:
    header                   logo and magazine-style meta lines
    #recommendations-section posters recommended for the user (issue #7)
    #history-section         thumbnails of watched films + the "+" button
    #modal                   pop-up to search and add a film (issue #11)

  Elements with an id are the ones app.js finds and changes.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page scale properly on phones instead of showing a zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextWatch</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Playfair Display (serif, for titles) and Inter (sans-serif, for text) from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div class="page">

      <!-- Masthead styled like the cover of a film magazine -->
      <header>
        <div class="header-top">
          <h1 class="logo">NextWatch</h1>
          <div class="meta">
            <span>Your cinema guide</span>
            <span>Vol. 1 — 2026</span>
          </div>
        </div>
        <div class="header-bottom">
          <span class="tagline">Personalized recommendations</span>
        </div>
      </header>

      <main>

        <!--
          Recommendations. The dashed boxes are placeholders that keep
          the layout visible until the recommendation engine (issue #7)
          fills #recommendations-list with real posters.
        -->
        <section id="recommendations-section">
          <p class="section-label">Recommended for you</p>
          <div class="poster-grid" id="recommendations-list">
            <div class="poster-placeholder"></div>
            <div class="poster-placeholder"></div>
            <div class="poster-placeholder"></div>
            <div class="poster-placeholder"></div>
          </div>
        </section>

        <!--
          Watch history. #history-list starts empty: issue #12 will
          fill it with thumbnails loaded from GET /history.
          The "+" button opens the modal below.
        -->
        <section id="history-section">
          <p class="section-label">Your history</p>
          <div class="history-strip">
            <div class="history-list" id="history-list"></div>
            <button class="add-btn" id="add-btn">+</button>
          </div>
        </section>

      </main>

    </div>

    <!--
      Search modal. It sits outside .page so it can cover the whole screen.
      Hidden by default; app.js adds the "open" class to show it.
      The overlay is the dark background, the box is the panel on top of it.
    -->
    <div class="modal-overlay" id="modal">
      <div class="modal-box">
        <button class="modal-close" id="modal-close">✕</button>
        <p class="modal-label">Add a film to your history</p>
        <input type="text" id="modal-input" placeholder="Search a film…" />
        <!-- Filled by renderResults() in app.js with one <li> per film -->
        <ul class="modal-results" id="modal-results"></ul>
      </div>
    </div>

    <!--
      Loaded last, after all the elements above exist.
      If it were in <head>, getElementById would run before
      the page was built and find nothing.
    -->
    <script src="app.js"></script>
  </body>
</html>
